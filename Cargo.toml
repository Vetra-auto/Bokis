[workspace]
resolver = "2"
members = [
    "crates/bokforing-core",
    "crates/bokforing-db",
    "crates/bokforing-export",
    "crates/bokforing-tauri",
]
exclude = [
    "crates/bokforing-ui",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
sqlx = { version = "0.8", features = ["sqlite", "uuid", "chrono", "migrate", "runtime-tokio"] }
argon2 = "0.5"
tokio = { version = "1", features = ["full"] }
