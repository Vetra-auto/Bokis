[package]
name = "bok-mcp"
description = "MCP-server för Bokis: ger AI-agenten verktyg för att läsa och föreslå, aldrig för att bokföra."
edition = "2021"
license = "MIT"
version = "0.1.0"

[[bin]]
name = "bok-mcp"
path = "src/main.rs"

[features]
# Kopplingen till Bokis databas. Utan den finns bara demoläget.
default = ["store"]
store = ["dep:bok-store", "dep:bok-archive"]

[dependencies]
bok-store = { path = "../bok-store", optional = true }
bok-archive = { path = "../bok-archive", optional = true }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
# Nedskalning av kvittofoton till agenten. Bara rena Rust-avkodare.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
