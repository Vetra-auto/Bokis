name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libappindicator3-dev \
            fonts-liberation

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/bokforing-ui -> crates/bokforing-ui/target

      - name: Install trunk and tauri-cli
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall trunk --no-confirm --locked
      - run: cargo binstall tauri-cli --no-confirm --locked

      - name: Run tests
        run: cargo test --workspace

      - name: Build frontend
        working-directory: crates/bokforing-ui
        run: trunk build --release

      - name: Build Tauri bundles
        working-directory: crates/bokforing-tauri
        run: cargo tauri build --bundles deb,appimage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
