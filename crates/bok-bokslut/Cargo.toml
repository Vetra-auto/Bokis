[package]
name = "bok-bokslut"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bokis: bokslutsposter som förslag – avskrivningar ur inventarieregistret, avyttringar, periodiseringar och bolagsskatt – och deklarationens indata ur lagret"

[dependencies]
bok-core = { path = "../bok-core" }
bok-deklaration = { path = "../bok-deklaration" }
bok-inventarier = { path = "../bok-inventarier" }
bok-store = { path = "../bok-store" }
chrono = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
